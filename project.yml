name: HabitGrow
options:
  bundleIdPrefix: com.charonyuu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  HabitGrow:
    type: application
    platform: iOS
    sources: [App, Shared]
    entitlements:
      path: App/HabitGrow.entitlements
      properties:
        com.apple.security.application-groups: [group.com.charonyuu.habitgrow]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charonyuu.habitgrow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Habit Grow
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconSakura AppIconCottage AppIconJapanese AppIconForest AppIconSnow AppIconTropical AppIconNight AppIconHouseCottage AppIconHouseJapanese AppIconHouseForest AppIconHouseSnow AppIconHouseTropical AppIconHouseNight"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "5"
    dependencies:
      - target: HabitGrowWidget
  HabitGrowWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/HabitGrowWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.charonyuu.habitgrow]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Habit Grow
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        CURRENT_PROJECT_VERSION: "5"
        PRODUCT_BUNDLE_IDENTIFIER: com.charonyuu.habitgrow.widget
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  HabitGrow:
    build:
      targets:
        HabitGrow: all
        HabitGrowWidget: all
    run:
      config: Debug
      storeKitConfiguration: HabitGrow.storekit
    archive:
      config: Release
